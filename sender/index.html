<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TLVP Signage Sender Dashboard</title>
    <!-- Firebase App (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- Google Cast SDK -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>
    <h1>TLVP Signage Controller</h1>
    
    <div>
        <h3>1. Cast to Screen</h3>
        <google-cast-launcher></google-cast-launcher>
    </div>

    <div>
        <h3>2. Screen Pairing</h3>
        <input type="text" id="pairingCode" placeholder="Enter Screen Code">
        <button id="pairBtn">Connect Screen</button>
    </div>

    <div>
        <h3>3. Playlist Management</h3>
        <textarea id="playlistInput" rows="5" cols="40" placeholder='["image1.jpg", "image2.jpg"]'></textarea>
        <br>
        <button id="updatePlaylistBtn">Update Playlist on Screen</button>
    </div>

    <!-- Load your shared Firebase config -->
    <script src="../assets/js/firebase-config.js"></script>
    <script>
        // Initialize Cast Context
        window['__onGCastApiAvailable'] = function(isAvailable) {
            if (isAvailable) {
                cast.framework.CastContext.getInstance().setOptions({
                    receiverApplicationId: '92F01C3B',
                    autoJoinPolicy: chrome.cast.AutoJoinPolicy.TAB_AND_ORIGIN_SCOPED
                });
            }
        };

        // Handle Playlist Updates via Firebase
        document.getElementById('updatePlaylistBtn').addEventListener('click', () => {
            const code = document.getElementById('pairingCode').value.trim();
            const rawData = document.getElementById('playlistInput').value;
            
            if (!code) {
                alert('Please enter a pairing code first.');
                return;
            }

            try {
                const playlistItems = JSON.parse(rawData);
                db.ref('sessions/' + code + '/playlist').set({
                    items: playlistItems,
                    updatedAt: Date.now()
                }).then(() => {
                    alert('Playlist successfully updated on screen!');
                });
            } catch (e) {
                alert('Invalid JSON format for playlist items.');
            }
        });
    </script>
</body>
</html>
