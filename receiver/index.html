<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Signage Receiver</title>
  <!-- Google Cast Web Receiver Framework v3 -->
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
      font-family: Arial, Helvetica, sans-serif;
    }
    .hidden {
      display: none !important;
    }
    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }
    #stage img, #stage video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #stage iframe {
      border: 0;
      width: 100%;
      height: 100%;
    }
    #pairing-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: none;
    }
    #pairing-screen h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    #pairingCode {
      font-size: 5rem;
      letter-spacing: 0.5rem;
      font-weight: bold;
      color: #4ade80;
      margin: 1rem 0;
    }
    #pairing-screen p {
      color: #aaa;
      margin-top: 1rem;
    }
    #flashMessage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      text-align: center;
      padding: 2rem;
      z-index: 2000;
      cursor: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #flashMessage.show {
      opacity: 1;
      pointer-events: auto;
    }
    #statusBadge {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: #888;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      z-index: 1500;
      cursor: none;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="stage" class="hidden"></div>
  <div id="pairing-screen">
    <h1>Display Not Paired</h1>
    <div id="pairingCode">----</div>
    <p>Open the dashboard and enter this code to assign this display.</p>
  </div>
  <div id="flashMessage"></div>
  <div id="statusBadge">Connecting...</div>

  <!-- Firebase + Cast Receiver Framework -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
